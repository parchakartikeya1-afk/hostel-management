{% extends "base.html" %}{% block title %}Add Payment{% endblock %}{% block content %}
<div class="form-card"><h2>Add Payment</h2><form method="POST">
<label>Student</label><select name="student_id" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.StudentID }}">{{ s.Name }}</option>{% endfor %}</select>
<label>Amount</label><input type="number" step="0.01" name="amount" required><label>Payment Date</label><input type="date" name="payment_date" required>
<label>Payment Type</label><select name="payment_type"><option>Hostel Fee</option><option>Mess Fee</option><option>Maintenance Fee</option><option>Other</option></select>
<label>Status</label><select name="payment_status"><option>Paid</option><option>Pending</option><option>Failed</option></select>
<button class="button" type="submit">Save Payment</button></form></div>{% endblock %}
