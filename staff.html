{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}
<div class="section-head"><div><h2>Staff</h2><p>Hostel staff information</p></div></div>
<div class="table-card"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Phone</th><th>Hostel</th></tr></thead><tbody>
{% for s in staff %}<tr><td>{{ s.StaffID }}</td><td>{{ s.Name }}</td><td>{{ s.Role }}</td><td>{{ s.Phone }}</td><td>{{ s.HostelName }}</td></tr>
{% else %}<tr><td colspan="5" class="empty">No staff records found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
